title: ClaudeRPG Wiki
description: Bilingual English and Thai reference for the ClaudeRPG Minecraft Bedrock add-on.
lang: en
markdown: kramdown
permalink: /:basename
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      lang: en
exclude:
  - README.md
  - docs/SUMMARY.md
  - docs/_Sidebar.md
  - docs/_Footer.md
  - Gemfile
  - Gemfile.lock
  - addon/ClaudeRPG_v1_39_0.zip
