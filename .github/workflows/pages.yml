name: Deploy ClaudeRPG Wiki V2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate wiki JavaScript syntax
        run: node --check assets/wiki.js
      - name: Validate inline JavaScript in wiki tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          pages = [Path("Toast-Generator.html")]
          with tempfile.TemporaryDirectory() as temp:
              for page in pages:
                  source = page.read_text(encoding="utf-8")
                  scripts = re.findall(r"<script\\b[^>]*>(.*?)</script>", source, flags=re.IGNORECASE | re.DOTALL)
                  for index, script in enumerate(scripts):
                      if not script.strip():
                          continue
                      target = Path(temp) / f"{page.stem}-{index}.js"
                      target.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(target)], check=True)
          PY
      - name: Extract ClaudeRPG images from the add-on archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("ClaudeRPG_v1_39_0.zip")
          if not archive.exists():
              raise SystemExit("ClaudeRPG_v1_39_0.zip was not found in the repository root")

          routes = {
              "ClaudeRP/textures/icons/ach/": Path("assets/images/achievements"),
              "ClaudeRP/textures/items/": Path("assets/images/items"),
              "ClaudeRP/textures/blocks/": Path("assets/images/blocks"),
              "ClaudeRP/textures/entity/": Path("assets/images/mobs"),
              "ClaudeRP/textures/crpg_toast/": Path("assets/images/ui/toast"),
              "ClaudeRP/textures/ui/clauderpg_rarity/": Path("assets/images/ui/rarity"),
          }
          with ZipFile(archive) as addon:
              copied = 0
              for name in addon.namelist():
                  if not name.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                      continue
                  for prefix, destination in routes.items():
                      if name.startswith(prefix):
                          target = destination / Path(name).name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with addon.open(name) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                          copied += 1
                          break
          print(f"Extracted {copied} image assets for the wiki build")
          PY
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated local links, assets, and anchors
        run: python scripts/validate_site.py ./_site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
