name: Deploy ClaudeRPG Wiki V2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate wiki JavaScript syntax
        run: |
          node --check assets/wiki.js
          node --check assets/toast-generator.js
      - name: Validate inline JavaScript in wiki tools
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          pages = [
              page for page in Path(".").rglob("*.html")
              if ".git" not in page.parts and "_site" not in page.parts
          ]
          with tempfile.TemporaryDirectory() as temp:
              for index, page in enumerate(pages):
                  source = page.read_text(encoding="utf-8")
                  scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", source, flags=re.IGNORECASE | re.DOTALL)
                  for script_index, script in enumerate(scripts):
                      if not script.strip():
                          continue
                      target = Path(temp) / f"inline-{index}-{script_index}.js"
                      target.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(target)], check=True)
          PY
      - name: Extract ClaudeRPG images from the add-on archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          archive = Path("addon/ClaudeRPG_v1_39_0.zip")
          if not archive.exists():
              raise SystemExit("addon/ClaudeRPG_v1_39_0.zip was not found")

          routes = {
              "ClaudeRP/textures/icons/ach/": Path("assets/images/achievements"),
              "ClaudeRP/textures/items/": Path("assets/images/items"),
              "ClaudeRP/textures/blocks/": Path("assets/images/blocks"),
              "ClaudeRP/textures/entity/": Path("assets/images/mobs"),
              "ClaudeRP/textures/crpg_toast/": Path("assets/images/ui/toast"),
              "ClaudeRP/textures/ui/clauderpg_rarity/": Path("assets/images/ui/rarity"),
          }
          with ZipFile(archive) as addon:
              copied = 0
              for name in addon.namelist():
                  if not name.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                      continue
                  for prefix, destination in routes.items():
                      if name.startswith(prefix):
                          target = destination / Path(name).name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with addon.open(name) as src, target.open("wb") as dst:
                              shutil.copyfileobj(src, dst)
                          copied += 1
                          break
          print(f"Extracted {copied} image assets for the wiki build")
          PY
      - name: Validate Toast textures and icon presets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path("tools/Toast-Generator.html").read_text(encoding="utf-8")
          frames = [Path("assets/images/ui/toast") / f"f{i}.png" for i in range(10)]
          missing_frames = [str(path) for path in frames if not path.is_file()]
          if missing_frames:
              raise SystemExit("Missing Toast frame textures: " + ", ".join(missing_frames))

          presets = set(re.findall(r'<option value="([A-Z0-9]{4})">', page))
          icon_root = Path("assets/images/achievements")
          missing_icons = [key for key in sorted(presets) if not (icon_root / f"{key}.png").is_file()]
          if missing_icons:
              raise SystemExit("Missing Toast icon preset textures: " + ", ".join(missing_icons))
          print(f"Verified {len(frames)} frames and {len(presets)} icon presets.")
          PY
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated local links, assets, and anchors
        run: python tools/scripts/validate_site.py ./_site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
